<!DOCTYPE html>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#eef4f0; --card:#fbfdfb; --border:#dbe6e0; --ink:#3f4a43; --muted:#7d9088;
    --accent:#c99a83; --accent-dark:#57736a;
    --playa-c:#6ea6b3; --playa-bg:#e4eff1;
    --montana-c:#8ba178; --montana-bg:#eef2ec;
    --rio-c:#5fa588; --rio-bg:#e6f3ec;
    --ciudad-c:#bb8b72; --ciudad-bg:#f2ebe4;
    --naturaleza-c:#7fae7a; --naturaleza-bg:#eaf3ec;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;min-height:640px;}
  #topbar{background:var(--accent-dark);color:#eef4f0;padding:14px 16px 12px;border-bottom:4px solid var(--accent);flex-shrink:0;}
  #topbar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-0.01em;font-family:Georgia,serif;display:flex;align-items:center;gap:8px;}
  #topbar p{margin:3px 0 10px;font-size:11px;color:#c7d6cd;font-family:monospace;}
  #controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  #controls input[type=text]{flex:1;min-width:140px;padding:8px 10px;border-radius:8px;border:none;font-size:13px;background:#eef4f0;color:#3f4a43;}
  #controls select{padding:7px 8px;border-radius:20px;border:1px solid #7fa294;background:#3f4a43;color:#eef4f0;font-size:12px;}
  #main{flex:1;display:flex;min-height:0;}
  #map{flex:1;min-width:0;}
  #sidebar{width:340px;max-width:42vw;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
  #list{padding:10px;}
  .item{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
  .item:hover{border-color:var(--accent);}
  .item h3{margin:0 0 2px;font-size:13.5px;font-weight:700;}
  .item p{margin:0;font-size:11.5px;color:var(--muted);}
  .item .row{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .km{font-family:monospace;font-size:10.5px;color:var(--muted);}
  .leaflet-popup-content-wrapper{border-radius:12px;background:var(--card);}
  .pop{min-width:220px;}
  .pop h3{margin:0 0 2px;font-size:14px;}
  .pop p.zone{margin:0 0 8px;font-size:12px;color:var(--muted);}
  .pop .prices{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:8px 0;}
  .pop .price{background:#eef4f0;border-radius:6px;padding:4px 6px;font-size:11px;}
  .pop .price b{display:block;font-size:13px;font-family:monospace;}
  .pop .links{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
  .pop a{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-decoration:none;color:var(--accent-dark);border:1px solid var(--border);border-radius:7px;padding:6px 8px;background:#fff;}
  .pop a.primary{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark);}
  .legend{position:absolute;bottom:14px;left:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11px;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .legend div{display:flex;align-items:center;gap:6px;margin:2px 0;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  @media (max-width:720px){
    #sidebar{display:none;}
    #main{flex-direction:column;}
  }
</style>
<div id="app">
  <div id="topbar">
    <h1>🏕 Ruta de Campings — España</h1>
    <p id="count">174 campings · mapa interactivo</p>
    <div id="controls">
      <input type="text" id="q" placeholder="Buscar nombre o zona..." />
      <select id="ca"></select>
      <select id="terrain"></select>
    </div>
  </div>
  <div id="main">
    <div id="map"></div>
    <div id="sidebar"><div id="list"></div></div>
  </div>
</div>

const TERRAIN = {
  playa: {label:"Costa", color:"#6ea6b3"},
  montana: {label:"Montaña", color:"#8ba178"},
  rio: {label:"Río / Lago", color:"#5fa588"},
  ciudad: {label:"Ciudad", color:"#bb8b72"},
  naturaleza: {label:"Naturaleza", color:"#7fae7a"},
};

function q(s){ return encodeURIComponent(s); }
function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function buildLinks(c){
  const place = c.n + ", " + c.z;
  const L = {
    maps: "https://www.google.com/maps/search/?api=1&query=" + q(place),
    waze: "https://waze.com/ul?q=" + q(place) + "&navigate=yes",
    photos: "https://www.google.com/search?tbm=isch&q=" + q(place),
    around: "https://www.google.com/maps/search/" + q("que ver cerca de " + c.z),
  };
  // Solo relevante si el camping esta cerca de la costa
  if (c.t === "playa") L.beaches = "https://www.google.com/maps/search/" + q("playas cerca de " + c.z);
  // Rutas de senderismo: no tiene sentido en campings urbanos
  if (c.t !== "ciudad") L.hiking = "https://www.google.com/maps/search/" + q("rutas de senderismo cerca de " + c.z);
  return L;
}

function popupHTML(c){
  const L = buildLinks(c);
  let extra = "";
  if (L.beaches) extra += `<a href="${L.beaches}" target="_blank">🏖 Playas cerca</a>`;
  if (L.hiking) extra += `<a href="${L.hiking}" target="_blank">🥾 Rutas de senderismo cerca</a>`;
  return `
    <div class="pop">
      <h3>${esc(c.n)}</h3>
      <p class="zone">${esc(c.z)} · ${esc(c.ca)} · ${c.km} km desde Torrejón</p>
      <div class="prices">
        <div class="price">Parcela<b>${c.pp}€</b></div>
        <div class="price">Adulto<b>${c.pa}€</b></div>
        <div class="price">Coche<b>${c.pc}€</b></div>
        <div class="price">Luz<b>${c.pl}€</b></div>
      </div>
      <p style="font-size:12px;margin:6px 0 0;">${esc(c.d)}</p>
      <div class="links">
        <a class="primary" href="${L.waze}" target="_blank">🚗 Ir con Waze</a>
        <a href="${L.maps}" target="_blank">📍 Ir con Google Maps</a>
        <a href="${L.photos}" target="_blank">🖼 Ver fotos del camping</a>
        ${extra}
        <a href="${L.around}" target="_blank">✨ Qué ver cerca</a>
      </div>
    </div>
  `;
}

const map = L.map('map', {zoomControl:true}).setView([40.0, -4.5], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markers = {};
CAMPINGS.forEach(c => {
  const meta = TERRAIN[c.t] || TERRAIN.naturaleza;
  const marker = L.circleMarker([c.lat, c.lon], {
    radius: 6,
    color: "#fff",
    weight: 1.5,
    fillColor: meta.color,
    fillOpacity: 0.9
  }).bindPopup(popupHTML(c), {maxWidth: 260});
  markers[c.n] = marker;
});

  const div = L.DomUtil.create('div','legend');
  div.innerHTML = Object.values(TERRAIN).map(t =>
    `<div><span class="dot" style="background:${t.color}"></span>${t.label}</div>`
  ).join('');
  return div;
};
legend.addTo(map);

// filtros
const caSel = document.getElementById('ca');
const terrainSel = document.getElementById('terrain');
const qInput = document.getElementById('q');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

const cas = [...new Set(CAMPINGS.map(c => c.ca))].sort();
caSel.innerHTML = '<option value="Todas">Todas las CCAA</option>' + cas.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
terrainSel.innerHTML = '<option value="Todos">Todo tipo</option>' + Object.entries(TERRAIN).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');

let activeGroup = L.layerGroup(Object.values(markers)).addTo(map);

function render(){
  const query = qInput.value.trim().toLowerCase();
  const ca = caSel.value;
  const terrain = terrainSel.value;

  const filtered = CAMPINGS.filter(c => {
    const mQ = !query || c.n.toLowerCase().includes(query) || c.z.toLowerCase().includes(query);
    const mCa = ca === "Todas" || c.ca === ca;
    const mT = terrain === "Todos" || c.t === terrain;
    return mQ && mCa && mT;
  });

  map.removeLayer(activeGroup);
  activeGroup = L.layerGroup(filtered.map(c => markers[c.n])).addTo(map);

  countEl.textContent = filtered.length + " campings · mapa interactivo";

  listEl.innerHTML = filtered.map(c => {
    const meta = TERRAIN[c.t] || TERRAIN.naturaleza;
    return `<div class="item" data-name="${esc(c.n)}">
      <h3>${esc(c.n)}</h3>
      <p>${esc(c.z)} · ${esc(c.ca)}</p>
      <div class="row">
        <span class="badge" style="background:${meta.color}22;color:${meta.color}">${meta.label}</span>
        <span class="km">${c.km} km · desde ${c.pp}€</span>
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => {
      const c = CAMPINGS.find(x => x.n === el.dataset.name);
      map.flyTo([c.lat, c.lon], 10, {duration:0.6});
      setTimeout(() => markers[c.n].openPopup(), 650);
    });
  });
}

qInput.addEventListener('input', render);
caSel.addEventListener('change', render);
terrainSel.addEventListener('change', render);

render();
</script>
