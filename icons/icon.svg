<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#57736a"/>

  <!-- sol/luna detras de la tienda -->
  <circle cx="190" cy="175" r="58" fill="#f3e9d8"/>

  <!-- tienda de campaña, contorno -->
  <path d="M256 92 L112 372 M256 92 L400 372" fill="none" stroke="#f3e9d8"
        stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 194 L190 372 L322 372 Z" fill="#c99a83"/>
  <rect x="128" y="372" width="256" height="18" rx="8" fill="#3f4a43"/>

  <!-- bandera España, pequeña -->
  <g transform="translate(148,410)">
    <clipPath id="esClip"><rect width="66" height="46" rx="6"/></clipPath>
    <g clip-path="url(#esClip)">
      <rect width="66" height="46" fill="#aa151b"/>
      <rect y="11.5" width="66" height="23" fill="#f1bf00"/>
    </g>
  </g>

  <!-- bandera Portugal, pequeña -->
  <g transform="translate(298,410)">
    <clipPath id="ptClip"><rect width="66" height="46" rx="6"/></clipPath>
    <g clip-path="url(#ptClip)">
      <rect width="26" height="46" fill="#006600"/>
      <rect x="26" width="40" height="46" fill="#ff0000"/>
    </g>
  </g>
</svg>
