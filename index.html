<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ruta de Campings — España y Portugal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>🏕 Ruta de Campings — España y Portugal</h1>
    <p id="count">cargando…</p>
    <div id="controls">
      <input type="text" id="q" placeholder="Buscar nombre o zona..." />
      <select id="ca"></select>
      <select id="terrain"></select>
      <button id="locateBtn" type="button"></button>
      <button id="favToggle" type="button"></button>
      <select id="lang"></select>
    </div>
  </div>
  <div id="main">
    <div id="map"></div>
    <div id="sidebar"><div id="list"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/campings.js?v=10"></script>
<script src="js/i18n.js?v=10"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
