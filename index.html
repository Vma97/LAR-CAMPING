<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IBERICAMP — Campings España y Portugal</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#29453D" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />
<link rel="stylesheet" href="css/styles.css" />
<script>
  // Aplicar el tema guardado antes de pintar, para evitar parpadeo claro/oscuro.
  (function(){
    var saved = localStorage.getItem("campingsTheme");
    if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1><img src="icons/logo-header.svg" alt="" class="logo-img" /> IBERICAMP</h1>
    <div class="subrow">
      <p id="count">cargando…</p>
      <span class="flags-stat" id="flagsStat"></span>
    </div>
    <div id="controls">
      <input type="text" id="q" placeholder="Buscar nombre o zona..." />
      <select id="ca"></select>
      <select id="terrain"></select>
      <button id="locateBtn" type="button"></button>
      <button id="favToggle" type="button"></button>
      <button id="themeToggle" type="button" title="Modo oscuro">🌙</button>
      <select id="lang"></select>
    </div>
    <div class="chips-row" id="chipsRow"></div>
  </div>
  <div id="main">
    <div id="map"></div>
    <div id="sidebar">
      <button id="mobileListToggle" aria-label="Mostrar lista"></button>
      <div id="list"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="data/campings.js?v=20"></script>
<script src="js/i18n.js?v=20"></script>
<script src="js/app.js?v=20"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
